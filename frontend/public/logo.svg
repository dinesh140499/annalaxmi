<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Wheat Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Elegant Border Ring -->
  <rect x="15" y="15" width="470" height="470" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Soft Decorative Glow Circle -->
  <circle cx="250" cy="185" r="130" fill="#10B981" opacity="0.08" filter="url(#glow)" />

  <!-- EMBLEM: Intertwined Wheat & Vital Pulse Wave -->
  <g filter="url(#dropShadow)">
    
    <!-- Central Wheat Stem Arch -->
    <path d="M 250 260 C 250 190, 245 130, 250 90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Top Wheat Grain Spikelet -->
    <path d="M 250 85 C 243 95, 243 105, 250 115 C 257 105, 257 95, 250 85 Z" fill="url(#goldGrad)" />

    <!-- Left Wheat Grains -->
    <g>
      <!-- Pair 1 -->
      <path d="M 248 120 C 230 115, 220 125, 222 138 C 234 142, 246 132, 248 120 Z" fill="url(#goldGrad)" />
      <!-- Pair 2 -->
      <path d="M 248 145 C 224 140, 212 152, 216 166 C 230 170, 244 158, 248 145 Z" fill="url(#goldGrad)" />
      <!-- Pair 3 -->
      <path d="M 248 172 C 220 168, 208 182, 212 196 C 228 200, 244 186, 248 172 Z" fill="url(#goldGrad)" />
      <!-- Pair 4 -->
      <path d="M 249 200 C 222 198, 212 212, 218 226 C 234 228, 246 214, 249 200 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Right Wheat Grains / Organic Leaves -->
    <g>
      <!-- Pair 1 -->
      <path d="M 252 120 C 270 115, 280 125, 278 138 C 266 142, 254 132, 252 120 Z" fill="url(#goldGrad)" />
      <!-- Pair 2 -->
      <path d="M 252 145 C 276 140, 288 152, 284 166 C 270 170, 256 158, 252 145 Z" fill="url(#goldGrad)" />
      <!-- Pair 3 -->
      <path d="M 252 172 C 280 168, 292 182, 288 196 C 272 200, 256 186, 252 172 Z" fill="url(#goldGrad)" />
      <!-- Pair 4 (Lush Sprout Leaf) -->
      <path d="M 251 200 C 278 198, 292 210, 294 226 C 280 234, 260 222, 251 200 Z" fill="url(#leafGrad)" />
    </g>

    <!-- Dynamic Heartbeat / Vitality Pulse Line cutting across base -->
    <g>
      <path d="M 125 245 L 195 245 L 215 210 L 235 275 L 260 165 L 285 290 L 305 235 L 320 255 L 335 245 L 375 245" 
            fill="none" 
            stroke="url(#pulseGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Pulse Dot Glow -->
      <circle cx="375" cy="245" r="5" fill="#34D399" filter="url(#glow)" />
      <circle cx="125" cy="245" r="5" fill="#34D399" filter="url(#glow)" />
    </g>

    <!-- Sprouting Organic Leaf Accent at top right -->
    <path d="M 288 100 C 315 90, 335 110, 325 135 C 300 135, 290 115, 288 100 Z" fill="url(#leafGrad)" opacity="0.9" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <!-- "GRAIN" (Pure Harvest Gold & Crisp White) -->
  <text x="250" y="380" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="46" 
        letter-spacing="4" 
        fill="#FFFFFF">
    GRAIN<tspan fill="url(#goldGrad)">PULSE</tspan>
  </text>

  <!-- Tagline Badge -->
  <g>
    <!-- Divider Line Left -->
    <line x1="100" y1="418" x2="165" y2="418" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    
    <!-- Tagline Text -->
    <text x="250" y="423" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="13" 
          letter-spacing="7" 
          fill="#A7F3D0">
      100% PURE &amp; ORGANIC
    </text>

    <!-- Divider Line Right -->
    <line x1="335" y1="418" x2="400" y2="418" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
