opencollection: 1.0.0

info:
  name: annalaxmi
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: Local_URL
      value: http://localhost:3000/api/v1/
    - name: Production_URL
      value: https://annalaxmi-backend.onrender.com/api/v1/
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
