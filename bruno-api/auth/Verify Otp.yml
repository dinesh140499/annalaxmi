info:
  name: Verify Otp
  type: http
  seq: 2

http:
  method: POST
  url: "{{Local_URL}}auth/verify-otp"
  body:
    type: form-urlencoded
    data:
      - name: phoneNo
        value: "919990645231"
      - name: otp
        value: "9732"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
