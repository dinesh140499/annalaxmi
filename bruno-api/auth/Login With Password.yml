info:
  name: Login With Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{Local_URL}}auth/login-with-password"
  body:
    type: form-urlencoded
    data:
      - name: phoneNo
        value: "919876543210"
        disabled: true
      - name: email
        value: admin@mail.com
      - name: password
        value: "123456"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
