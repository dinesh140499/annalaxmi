info:
  name: Set Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{Local_URL}}auth/set-password"

  body:
    type: form-urlencoded
    data:
      - name: password
        value: admin@123
      - name: confirmPassword
        value: admin@123
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "// Visualization Script\r

        // Visualization Script\r

        const response = res.getBody();\r

        \r

        const template = `\r

        <style>\r

        \  body { font-family: Arial, sans-serif; padding: 16px; }\r

        \  h2 { color: #333; }\r

        \  table { border-collapse: collapse; width: 100%; }\r

        \  th { background-color: #FF6C37; color: white; padding: 10px 12px; text-align: left; }\r

        \  td { padding: 8px 12px; border-bottom: 1px solid #ddd; }\r

        \  tr:nth-child(even) { background-color: #f9f9f9; }\r

        \  tr:hover { background-color: #f1f1f1; }\r

        \  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }\r

        \  .home { background: #d4edda; color: #155724; }\r

        \  .work { background: #cce5ff; color: #004085; }\r

        \  .default-yes { background: #fff3cd; color: #856404; }\r

        \  .no-data { text-align: center; color: #999; padding: 20px; }\r

        </style>\r

        <h2>Address Book</h2>\r

        {{#if addresses}}\r

        <table>\r

        \  <thead>\r

        \    <tr>\r

        \      <th>#</th>\r

        \      <th>Name</th>\r

        \      <th>Phone</th>\r

        \      <th>Company</th>\r

        \      <th>Address</th>\r

        \      <th>Landmark</th>\r

        \      <th>Type</th>\r

        \      <th>Default</th>\r

        \    </tr>\r

        \  </thead>\r

        \  <tbody>\r

        \    {{#each addresses}}\r

        \    <tr>\r

        \      <td>{{rowIndex}}</td>\r

        \      <td>{{fullName}}</td>\r

        \      <td>{{phone}}</td>\r

        \      <td>{{company_name}}</td>\r

        \      <td>{{fullAddress}}</td>\r

        \      <td>{{landmark}}</td>\r

        \      <td><span class=\"badge {{type}}\">{{type}}</span></td>\r

        \      <td>{{#if isDefault}}<span class=\"badge default-yes\">Yes</span>{{else}}No{{/if}}</td>\r

        \    </tr>\r

        \    {{/each}}\r

        \  </tbody>\r

        </table>\r

        {{else}}\r

        <p class=\"no-data\">No addresses found.</p>\r

        {{/if}}\r

        `;\r

        \r

        function createPayload() {\r

        \  const data = res.getBody();\r

        \  const addresses = (data.addresses || []).map((addr, i) => ({\r

        \    rowIndex: i + 1,\r

        \    fullName: (addr.firstname || '') + ' ' + (addr.lastname || ''),\r

        \    phone: addr.phone || '',\r

        \    company_name: addr.company_name || '',\r

        \    fullAddress: [addr.street, addr.city, addr.state, addr.country, addr.zip_code].filter(Boolean).join(', '),\r

        \    landmark: addr.landmark || '',\r

        \    type: addr.type || '',\r

        \    isDefault: addr.isDefault\r

        \  }));\r

        \  return { addresses };\r

        }\r

        \r

        bru.visualize(\"html\", {\r

        \  template: template,\r

        \  data: createPayload()\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
