info:
  name: Send Otp
  type: http
  seq: 1

http:
  method: POST
  url: "{{Local_URL}}auth/send-otp"
  body:
    type: form-urlencoded
    data:
      - name: phoneNo
        value: "9990645231"
      - name: dialCode
        value: "91"
      - name: country
        value: in
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
